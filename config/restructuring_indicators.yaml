- indicator_id: R14
  number: 14
  name: Percentual de notificações de incidentes triadas no prazo
  purpose: Triagem e cultura de notificação
  action: Triagem e cultura de notificação
  unit: '%'
  improvement: aumentar
  formula: notificações com prazo original de triagem vencendo no período, triadas
    até esse prazo ÷ total de notificações com prazo original de triagem vencendo
    no período × 100.
  numerator_definition: notificações com prazo original de triagem vencendo no período,
    triadas até esse prazo
  denominator_definition: total de notificações com prazo original de triagem vencendo
    no período
  eligibility_rules:
  - Definir prazo interno por gravidade e início da contagem.
  - Não contar duas vezes a mesma notificação.
  - Mostrar notificações recebidas, triadas e pendentes como contagens complementares.
  - Não criar meta de redução da quantidade de relatos.
  - Mais notificações podem refletir melhora da confiança e da detecção.
  - A taxa de notificações por 1.000 pacientes-dia pode ser análise complementar,
    somente com fontes consistentes e mesmo escopo de internação. Ela não substitui
    o percentual de triagem nem representa incidência real de dano.
