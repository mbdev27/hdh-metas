- indicator_id: R04
  number: 4
  name: Percentual de cirurgias observadas com execução correta dos três momentos
    de segurança
  purpose: Execução da cirurgia segura
  action: Execução da cirurgia segura
  unit: '%'
  improvement: aumentar
  formula: cirurgias observadas com os três momentos corretamente executados ÷ total
    de cirurgias elegíveis observadas integralmente × 100.
  numerator_definition: cirurgias observadas com os três momentos corretamente executados
  denominator_definition: total de cirurgias elegíveis observadas integralmente
  eligibility_rules:
  - Observar antes da indução anestésica, antes da incisão e antes da saída da sala.
  - Conferir momento, participação da equipe e verificações aplicáveis.
  - Observações parciais devem aparecer como perdas, separadas do cálculo principal.
  - Mostrar tamanho da amostra, turnos e especialidades.
  - Uma cirurgia com falha em qualquer momento não entra no numerador.
  - Falhas críticas exigem resposta imediata.
  - Não tratar uma amostra operacional como estimativa estatística universal.
  conclusion_criteria: Cumprimento comprovado das etapas descritas, com evidência
    e validação técnica.
  source: observação direta por avaliador treinado.
  collection_method: Observação integral por avaliador treinado; informar amostra
    e perdas
  frequency: observação semanal e consolidação mensal.
