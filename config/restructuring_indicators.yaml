- indicator_id: R07
  number: 7
  name: Percentual de reincidência de não conformidades
  purpose: Sustentação das melhorias
  action: Sustentação das melhorias
  unit: '%'
  improvement: reduzir
  formula: não conformidades encerradas e reavaliadas que reapareceram no mesmo requisito
    e setor durante a janela de 90 dias ÷ total de não conformidades encerradas reavaliadas
    após completar essa janela × 100.
  numerator_definition: não conformidades encerradas e reavaliadas que reapareceram
    no mesmo requisito e setor durante a janela de 90 dias
  denominator_definition: total de não conformidades encerradas reavaliadas após completar
    essa janela
  eligibility_rules:
  - Casos sem janela completa não entram no cálculo principal.
  - Mostrar cobertura da reavaliação entre os casos com janela completa.
  - Não selecionar somente os melhores casos.
  - Uma falha ainda aberta não constitui nova reincidência de um encerramento.
  - Reincidência crítica exige análise e intervenção imediatas.
  conclusion_criteria: Cumprimento comprovado das etapas descritas, com evidência
    e validação técnica.
  source: histórico de achados, encerramentos e reauditorias.
  collection_method: Inventário e registros verificáveis
  frequency: mensal, após amadurecimento das janelas.
