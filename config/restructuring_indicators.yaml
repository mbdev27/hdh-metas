notice: '**Indicadores propostos para o estudo de caso.** Este painel apresenta indicadores
  sugeridos com base em requisitos e boas práticas descritos em instrumentos normativos
  oficiais aplicáveis. As fórmulas operacionais, metas, prazos e regras de acompanhamento
  constituem propostas de gestão e devem ser avaliados e pactuados com a diretoria
  e os responsáveis técnicos da unidade. Os indicadores podem ser repactuados mediante
  registro e aprovação. Metas intermediárias não autorizam descumprimento legal ou
  manutenção de condições inseguras.'
disclaimer: Os dados utilizados na demonstração, quando fictícios, não representam
  resultados atuais do hospital. A ferramenta não é apresentada como produto oficial
  ou homologado pela Fundação de Gestão Hospitalar Martiniano Fernandes.
indicators:
- indicator_id: R01
  number: 1
  name: Percentual de documentos obrigatórios válidos
  purpose: Regularização documental
  action: Regularização documental
  unit: '%'
  improvement: aumentar
  formula: documentos obrigatórios aplicáveis válidos e verificáveis na data de corte
    ÷ total de documentos obrigatórios aplicáveis no inventário aprovado × 100.
  numerator_definition: documentos obrigatórios aplicáveis válidos e verificáveis
    na data de corte
  denominator_definition: total de documentos obrigatórios aplicáveis no inventário
    aprovado
  eligibility_rules:
  - Documento protocolado não equivale a documento concedido.
  - Documento vencido, ausente ou com escopo insuficiente não entra no numerador.
  - Exclusão por não aplicabilidade exige justificativa e validação.
  - Separar as trilhas sanitária, Corpo de Bombeiros e conselho profissional.
  - Não prometer prazo de emissão que dependa de órgão externo.
  conclusion_criteria: Cumprimento comprovado das etapas descritas, com evidência
    e validação técnica.
  source: inventário documental, documentos e consulta ao emissor.
  collection_method: Inventário e registros verificáveis
