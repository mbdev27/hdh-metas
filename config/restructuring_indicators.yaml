- indicator_id: R06
  number: 6
  name: Percentual de não conformidades encerradas no prazo e com eficácia comprovada
  purpose: Tratamento de não conformidades
  action: Tratamento de não conformidades
  unit: '%'
  improvement: aumentar
  formula: não conformidades com prazo original vencendo no período, encerradas e
    validadas até esse prazo ÷ total de não conformidades com prazo original vencendo
    no período × 100.
  numerator_definition: não conformidades com prazo original vencendo no período,
    encerradas e validadas até esse prazo
  denominator_definition: total de não conformidades com prazo original vencendo no
    período
  eligibility_rules:
  - Execução de uma tarefa não equivale a eficácia comprovada.
  - Conclusão tardia não conta como conclusão no prazo.
  - Alterar o prazo não apaga o prazo original.
  - Mostrar também pendências vencidas, tempo de atraso e riscos críticos.
  conclusion_criteria: Cumprimento comprovado das etapas descritas, com evidência
    e validação técnica.
